<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sci-Fi Баллистическая Лаборатория</title>
<style>
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
        margin: 0; padding: 0; overflow: hidden;
        font-family: 'Segoe UI', Arial, sans-serif;
        background-color: #060810; color: #fff;
        user-select: none;
    }
    canvas { display: block; position: fixed; inset: 0; }

    .ui-panel {
        position: absolute; top: 20px; left: 20px;
        background: rgba(13, 17, 28, 0.9);
        border: 1px solid #1f293d;
        padding: 22px; border-radius: 16px; width: 290px;
        z-index: 10; box-shadow: 0 10px 30px rgba(0,0,0,0.7);
        backdrop-filter: blur(12px);
    }
    h1 {
        font-size: 15px; margin: 0 0 18px 0; text-align: center;
        color: #00f3ff; text-transform: uppercase; letter-spacing: 1.5px;
        text-shadow: 0 0 10px rgba(0,243,255,0.3);
    }
    .control-group { margin-bottom: 14px; }
    label {
        display: block; font-size: 11px; margin-bottom: 6px;
        color: #7e8b9b; text-transform: uppercase;
    }
    .slider-val {
        float: right; color: #00f3ff; font-weight: bold;
        font-family: monospace; font-size: 13px;
    }
    input[type="range"] { width: 100%; cursor: pointer; accent-color: #00f3ff; }
    button {
        width: 100%; padding: 14px;
        background: linear-gradient(135deg, #00f3ff, #0066ff);
        border: none; border-radius: 8px; color: #060810;
        font-weight: bold; font-size: 13px; text-transform: uppercase;
        letter-spacing: 1px; cursor: pointer; margin-top: 5px;
        transition: box-shadow .2s, filter .2s;
    }
    button:hover { box-shadow: 0 6px 20px rgba(0,243,255,0.5); }
    button:disabled { filter: grayscale(0.6) brightness(0.7); cursor: default; box-shadow: none; }

    .formula-panel {
        position: absolute; top: 20px; right: 20px;
        background: rgba(13, 17, 28, 0.85);
        border: 1px solid #1f293d;
        padding: 16px; border-radius: 16px; width: 320px;
        z-index: 10; font-family: monospace; font-size: 13px;
        backdrop-filter: blur(12px);
    }
    .formula-title {
        color: #00f3ff; margin-bottom: 10px; font-weight: bold;
        text-transform: uppercase; font-size: 11px;
    }
    .formula-block {
        background: #090b11; padding: 10px 12px; border-radius: 8px;
        margin-bottom: 10px; border-left: 3px solid #0066ff;
        color: #dbdeb8; line-height: 1.6;
    }
    .formula-block:last-child { margin-bottom: 0; }

    .stats-panel {
        position: absolute; bottom: 20px; left: 20px;
        background: rgba(13, 17, 28, 0.9);
        border: 1px solid #1f293d;
        padding: 16px; border-radius: 16px; width: 290px; z-index: 10;
    }
    .stats-line { display: flex; justify-content: space-between; margin-bottom: 8px; align-items: center; }
    .stats-line:last-child { margin-bottom: 0; }
    .stats-label { color: #7e8b9b; font-size: 12px; text-transform: uppercase; }
    .stats-value { color: #ffca28; font-family: monospace; font-size: 15px; font-weight: bold; }
    .stats-value.live { color: #00f3ff; }
</style>
</head>
<body>

<canvas id="simCanvas"></canvas>

<div class="ui-panel">
    <h1>Параметры системы</h1>
    <div class="control-group">
        <label>Угол прицела: <span id="angle-val" class="slider-val">45°</span></label>
        <input type="range" id="angle-slider" min="5" max="85" value="45">
    </div>
    <div class="control-group">
        <label>Скорость (v₀): <span id="speed-val" class="slider-val">50 м/с</span></label>
        <input type="range" id="speed-slider" min="15" max="90" value="50">
    </div>
    <div class="control-group">
        <label>Гравитация (g): <span id="g-val" class="slider-val">9.8 м/с²</span></label>
        <input type="range" id="g-slider" min="2" max="25" step="0.1" value="9.8">
    </div>
    <button id="fire-btn">Запустить снаряд</button>
</div>

<div class="formula-panel">
    <div class="formula-title">Уравнения движения тела:</div>
    <div class="formula-block">
        <strong>По оси X (равномерное):</strong>

        x(t) = v₀ · cos(α) · t

        <span id="formula-x" style="color:#00f3ff;font-weight:bold;">x(t) = 35.4 · t</span>
    </div>
    <div class="formula-block">
        <strong>По оси Y (равноускоренное):</strong>

        y(t) = v₀ · sin(α) · t − (g · t²) / 2

        <span id="formula-y" style="color:#ffaa00;font-weight:bold;">y(t) = 35.4 · t − 4.90 · t²</span>
    </div>
</div>

<div class="stats-panel">
    <div class="stats-line"><span class="stats-label">Дальность (X):</span><span id="stat-range" class="stats-value">0.00 м</span></div>
    <div class="stats-line"><span class="stats-label">Высота (H):</span><span id="stat-height" class="stats-value">0.00 м</span></div>
    <div class="stats-line"><span class="stats-label">Время (T):</span><span id="stat-time" class="stats-value">0.00 с</span></div>
</div>

<script>
(function () {
    'use strict';

    /* ================= DOM ================= */
    const canvas = document.getElementById('simCanvas');
    const ctx    = canvas.getContext('2d');

    const angleSlider = document.getElementById('angle-slider');
    const speedSlider = document.getElementById('speed-slider');
    const gSlider     = document.getElementById('g-slider');
    const fireBtn     = document.getElementById('fire-btn');

    const angleValEl  = document.getElementById('angle-val');
    const speedValEl  = document.getElementById('speed-val');
    const gValEl      = document.getElementById('g-val');

    const statRangeEl  = document.getElementById('stat-range');
    const statHeightEl = document.getElementById('stat-height');
    const statTimeEl   = document.getElementById('stat-time');

    const formulaXEl = document.getElementById('formula-x');
    const formulaYEl = document.getElementById('formula-y');

    /* ================= Геометрия сцены ================= */
    let W = 0, H = 0;
    const START_X = 90;
    const GROUND_OFFSET = 110;
    const groundY = () => H - GROUND_OFFSET;

    /* ================= ФОН ================= */
    let bgCanvas = null;
    let stars = [];

    function initStars() {
        stars = [];
        const count = Math.min(240, Math.max(80, Math.floor((W * H) / 6500)));
        for (let i = 0; i < count; i++) {
            const rnd = Math.random();
            stars.push({
                x: Math.random() * W,
                y: Math.random() * H * 0.82,
                r: Math.random() * 1.3 + 0.2,
                phase: Math.random() * Math.PI * 2,
                speed: 0.4 + Math.random() * 1.5,
                brightness: 0.3 + Math.random() * 0.7,
                color: rnd < 0.7 ? '255,255,255'
                     : rnd < 0.85 ? '180,220,255'
                     : '255,220,180'
            });
        }
    }

    function drawMountainLayer(bgc, baseY, color, maxH, freq, seed, lift) {
        const step = 5;
        bgc.beginPath();
        bgc.moveTo(0, baseY);
        for (let x = 0; x <= W + step; x += step) {
            const wave =
                0.55 * Math.sin(x * 0.0028 * freq + seed) +
                0.28 * Math.sin(x * 0.0071 * freq + seed * 1.7) +
                0.12 * Math.sin(x * 0.0153 * freq + seed * 2.3) +
                0.05 * Math.sin(x * 0.0341 * freq + seed * 3.1);
            const h = maxH * (Math.abs(wave) * 1.35 + 0.06);
            bgc.lineTo(x, baseY - h - lift);
        }
        bgc.lineTo(W, baseY);
        bgc.closePath();
        bgc.fillStyle = color;
        bgc.fill();
    }

    function buildBackground() {
        bgCanvas = document.createElement('canvas');
        bgCanvas.width = W;
        bgCanvas.height = H;
        const bgc = bgCanvas.getContext('2d');
        const gy = groundY();

        /* ---- Небо ---- */
        const sky = bgc.createLinearGradient(0, 0, 0, gy);sky.addColorStop(0,    '#02040a');
        sky.addColorStop(0.45, '#050a18');
        sky.addColorStop(0.72, '#0a1024');
        sky.addColorStop(1,    '#0d1730');
        bgc.fillStyle = sky;
        bgc.fillRect(0, 0, W, gy);

        /* ---- Туманности ---- */
        const nebulas = [
            { x: W * 0.15, y: gy * 0.30, r: Math.min(W, H) * 0.55, c1: 'rgba(80,40,170,0.22)',  c2: 'rgba(80,40,170,0)' },
            { x: W * 0.78, y: gy * 0.22, r: Math.min(W, H) * 0.60, c1: 'rgba(0,140,210,0.16)',  c2: 'rgba(0,140,210,0)' },
            { x: W * 0.50, y: gy * 0.55, r: Math.min(W, H) * 0.70, c1: 'rgba(140,30,180,0.11)', c2: 'rgba(140,30,180,0)' },
            { x: W * 0.92, y: gy * 0.55, r: Math.min(W, H) * 0.42, c1: 'rgba(0,200,255,0.10)',  c2: 'rgba(0,200,255,0)' }
        ];
        for (const n of nebulas) {
            const g = bgc.createRadialGradient(n.x, n.y, 0, n.x, n.y, n.r);
            g.addColorStop(0, n.c1);
            g.addColorStop(1, n.c2);
            bgc.fillStyle = g;
            bgc.fillRect(0, 0, W, gy);
        }

        /* ---- Полярное свечение ---- */
        for (let i = 0; i < 3; i++) {
            const yBase = gy * (0.12 + i * 0.09);
            const gr = bgc.createLinearGradient(0, yBase - 40, 0, yBase + 40);
            gr.addColorStop(0, 'rgba(0,255,180,0)');
            gr.addColorStop(0.5, `rgba(${60 + i * 25},255,${150 + i * 40},0.045)`);
            gr.addColorStop(1, 'rgba(0,255,180,0)');
            bgc.fillStyle = gr;
            bgc.fillRect(0, yBase - 40, W, 80);
        }

        /* ---- Далёкая планета с кольцами ---- */
        const px = W * 0.82;
        const py = gy * 0.20;
        const pr = Math.min(W, H) * 0.055;
        if (pr > 14) {
            const glow = bgc.createRadialGradient(px, py, pr * 0.6, px, py, pr * 3);
            glow.addColorStop(0, 'rgba(100,180,255,0.28)');
            glow.addColorStop(1, 'rgba(100,180,255,0)');
            bgc.fillStyle = glow;
            bgc.fillRect(px - pr * 3, py - pr * 3, pr * 6, pr * 6);

            const body = bgc.createRadialGradient(
                px - pr * 0.35, py - pr * 0.35, pr * 0.1, px, py, pr
            );
            body.addColorStop(0,    'rgba(180,220,255,0.95)');
            body.addColorStop(0.55, 'rgba(80,140,220,0.90)');
            body.addColorStop(1,    'rgba(20,40,90,0.95)');
            bgc.fillStyle = body;
            bgc.beginPath();
            bgc.arc(px, py, pr, 0, Math.PI * 2);
            bgc.fill();

            /* Пояса на планете */
            bgc.save();
            bgc.beginPath();
            bgc.arc(px, py, pr, 0, Math.PI * 2);
            bgc.clip();
            bgc.fillStyle = 'rgba(20,50,110,0.35)';
            bgc.beginPath();
            bgc.ellipse(px, py + pr * 0.35, pr * 0.9, pr * 0.12, 0, 0, Math.PI * 2);
            bgc.fill();
            bgc.beginPath();
            bgc.ellipse(px, py - pr * 0.18, pr * 0.7, pr * 0.09, 0, 0, Math.PI * 2);
            bgc.fill();
            bgc.restore();

            /* Кольца */
            bgc.save();
            bgc.translate(px, py);
            bgc.rotate(-0.35);
            bgc.strokeStyle = 'rgba(140,200,255,0.45)';
            bgc.lineWidth = 1.5;
            bgc.beginPath();
            bgc.ellipse(0, 0, pr * 1.8, pr * 0.28, 0, 0, Math.PI * 2);
            bgc.stroke();
            bgc.strokeStyle = 'rgba(140,200,255,0.22)';
            bgc.lineWidth = 3;
            bgc.beginPath();
            bgc.ellipse(0, 0, pr * 2.1, pr * 0.34, 0, 0, Math.PI * 2);
            bgc.stroke();
            bgc.restore();
        }

        /* ---- Три слоя гор ---- */
        drawMountainLayer(bgc, gy, 'rgba(14,22,40,0.85)', H * 0.14, 0.9, 1.5, 0);
        drawMountainLayer(bgc, gy, 'rgba(9,14,26,0.95)',  H * 0.10, 1.5, 3.7, 4);
        drawMountainLayer(bgc, gy, 'rgba(4,7,14,1)',      H * 0.06, 2.2, 5.3, 8);

        /* ---- Свечение над горизонтом ---- */
        const hor = bgc.createLinearGradient(0, gy - 130, 0, gy);
        hor.addColorStop(0,   'rgba(0,120,180,0)');
        hor.addColorStop(0.7, 'rgba(0,160,220,0.08)');
        hor.addColorStop(1,   'rgba(0,180,240,0.20)');
        bgc.fillStyle = hor;
        bgc.fillRect(0, gy - 130, W, 130);
    }

    function drawStars(time) {
        const t = time * 0.001;
        for (const s of stars) {
            const tw = 0.5 + 0.5 * Math.sin(t * s.speed + s.phase);
            const alpha = s.brightness * (0.55 + 0.45 * tw);

            if (s.r > 0.9) {
                ctx.fillStyle = 'rgba(' + s.color + ',' + (alpha * 0.22).toFixed(3) + ')';
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.r * 3.5, 0, Math.PI * 2);
                ctx.fill();
            }

            ctx.fillStyle = 'rgba(' + s.color + ',' + alpha.toFixed(3) + ')';
            ctx.beginPath();
            ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    function drawHaze() {
        const gy = groundY();
        const haze = ctx.createLinearGradient(0, gy - 180, 0, gy);
        haze.addColorStop(0,   'rgba(0,150,220,0)');
        haze.addColorStop(0.6, 'rgba(0,170,230,0.06)');
        haze.addColorStop(1,   'rgba(0,190,255,0.16)');
        ctx.fillStyle = haze;
        ctx.fillRect(0, gy - 180, W, 180);
    }

    /* ================= resize ================= */
    function resize() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        W = window.innerWidth;
        H = window.innerHeight;
        canvas.width  = Math.round(W * dpr);
        canvas.height = Math.round(H * dpr);
        canvas.style.width  = W + 'px';
        canvas.style.height = H + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        initStars();
        buildBackground();
    }

    /* ================= Состояние ================= */
    let angle = 45, speed = 50, gravity = 9.8;
    let scale = 1;
    let flying = false, t = 0;
    let posX = 0, posY = 0;
    let trail = [], particles = [];
    let flash = 0, impact = null;

    /* ================= Физика ================= */
    function trajectory() {
        const rad = angle * Math.PI / 180;
        const v0x = speed * Math.cos(rad);
        const v0y = speed * Math.sin(rad);
        const T   = (2 * v0y) / gravity;
        const X   = v0x * T;
        const Hm  = (v0y * v0y) / (2 * gravity);
        return { rad, v0x, v0y, T, X, Hm };
    }

    function computeScale(tr) {
        const availW = Math.max(60, W - START_X - 90);
        const availH = Math.max(60, groundY() - 100);
        const sx = tr.X  > 0.01 ? availW / tr.X  : 10;
        const sy = tr.Hm > 0.01 ? availH / tr.Hm : 10;
        return Math.max(0.02, Math.min(sx, sy));
    }

    /* ================= UI ================= */
    function refreshStats() {
        if (flying) {
            statRangeEl.textContent  = posX.toFixed(2) + ' м';
            statHeightEl.textContent = Math.max(0, posY).toFixed(2) + ' м';
            statTimeEl.textContent   = t.toFixed(2) + ' с';
            statRangeEl.classList.add('live');
            statHeightEl.classList.add('live');
            statTimeEl.classList.add('live');
        } else {
            const tr = trajectory();
            statRangeEl.textContent  = tr.X.toFixed(2) + ' м';
            statHeightEl.textContent = tr.Hm.toFixed(2) + ' м';
            statTimeEl.textContent   = tr.T.toFixed(2) + ' с';
            statRangeEl.classList.remove('live');
            statHeightEl.classList.remove('live');
            statTimeEl.classList.remove('live');
        }
    }

    function updateParams() {
        angle   = parseFloat(angleSlider.value);
        speed   = parseFloat(speedSlider.value);
        gravity = parseFloat(gSlider.value);

        angleValEl.textContent = angle.toFixed(0) + '°';
        speedValEl.textContent = speed.toFixed(0) + ' м/с';
        gValEl.textContent     = gravity.toFixed(1) + ' м/с²';

        const tr = trajectory();
        scale = computeScale(tr);

        formulaXEl.textContent = 'x(t) = ' + tr.v0x.toFixed(1) + ' · t';
        formulaYEl.textContent = 'y(t) = ' + tr.v0y.toFixed(1) + ' · t − ' +
                                 (gravity / 2).toFixed(2) + ' · t²';

        if (!flying) { t = 0; posX = 0; posY = 0; trail = []; }
        refreshStats();
    }

    /* ================= Полёт ================= */
    function launch() {
        if (flying) return;
        flying = true; t = 0; posX = 0; posY = 0;
        trail = []; particles = []; flash = 0; impact = null;

        const rad = angle * Math.PI / 180;
        const mx = START_X + Math.cos(rad) * 50;
        const my = groundY() - Math.sin(rad) * 50;
        for (let i = 0; i < 18; i++) {
            const a = -rad + (Math.random() - 0.5) * 1.0;
            const sp = 80 + Math.random() * 220;
            const life = 0.2 + Math.random() * 0.35;
            particles.push({
                x: mx, y: my, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
                life: life, maxLife: life,
                size: 1 + Math.random() * 2.5, color: '0,243,255'
            });
        }

        fireBtn.textContent = 'В полёте…';
        fireBtn.disabled = true;
        refreshStats();
    }

    function explode() {
        const px = START_X + posX * scale;
        const py = groundY() - posY * scale;
        impact = { x: px, y: py };
        flash = 1;
        for (let i = 0; i < 70; i++) {
            const a  = Math.random() * Math.PI * 2;
            const sp = 60 + Math.random() * 320;
            const life = 0.35 + Math.random() * 0.9;
            particles.push({
                x: px, y: py,
                vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 140,
                life: life, maxLife: life,
                size: 1 + Math.random() * 3,
                color: Math.random() < 0.5 ? '0,243,255' : '255,170,0'
            });
        }
    }

    function land() {
        posY = 0; flying = false; explode();
        fireBtn.textContent = 'Запустить снаряд';
        fireBtn.disabled = false;
        refreshStats();
    }

    /* ================= Обновление ================= */
    function update(dt) {
        if (flying) {
            t += dt;
            const tr = trajectory();
            posX = tr.v0x * t;
            posY = tr.v0y * t - 0.5 * gravity * t * t;
            trail.push({ x: posX, y: posY, life: 1 });
            if (trail.length > 400) trail.shift();

            if (t > 0.02 && posY <= 0) land();
            else refreshStats();
        }

        for (let i = trail.length - 1; i >= 0; i--) {
            trail[i].life -= dt * 0.35;
            if (trail[i].life <= 0) trail.splice(i, 1);
        }

        for (let i = particles.length - 1; i >= 0; i--) {
            const p = particles[i];
            p.x += p.vx * dt;
            p.y += p.vy * dt;
            p.vy += 900 * dt;
            p.vx *= 0.985;
            p.vy *= 0.985;
            p.life -= dt;
            if (p.life <= 0) particles.splice(i, 1);
        }

        if (flash > 0) flash = Math.max(0, flash - dt * 2.5);
    }

    /* ================= Рисование сцены ================= */
    function roundRectPath(x, y, w, h, r) {
        r = Math.min(r, w / 2, h / 2);
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.lineTo(x + w - r, y);
        ctx.quadraticCurveTo(x + w, y, x + w, y + r);
        ctx.lineTo(x + w, y + h - r);
        ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
        ctx.lineTo(x + r, y + h);
        ctx.quadraticCurveTo(x, y + h, x, y + h - r);
        ctx.lineTo(x, y + r);
        ctx.quadraticCurveTo(x, y, x + r, y);
        ctx.closePath();
    }

    function drawTrajectoryPreview() {
        const tr = trajectory();
        if (tr.T <= 0) return;
        const gy = groundY();
        const steps = 90;

        ctx.beginPath();
        for (let i = 0; i <= steps; i++) {
            const tt = tr.T * i / steps;
            const x = START_X + tr.v0x * tt * scale;
            const y = gy - (tr.v0y * tt- 0.5 * gravity * tt * tt) * scale;
            if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        }
        ctx.setLineDash([5, 8]);
        ctx.lineWidth = 1.5;
        ctx.strokeStyle = flying ? 'rgba(0,243,255,0.10)' : 'rgba(0,243,255,0.35)';
        ctx.stroke();
        ctx.setLineDash([]);
    }

    function drawGround() {
        const gy = groundY();
        const grad = ctx.createLinearGradient(0, gy, 0, gy + 70);
        grad.addColorStop(0, 'rgba(0,243,255,0.12)');
        grad.addColorStop(1, 'rgba(0,243,255,0)');
        ctx.fillStyle = grad;
        ctx.fillRect(0, gy, W, 70);

        ctx.strokeStyle = '#1f293d';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(0, gy);
        ctx.lineTo(W, gy);
        ctx.stroke();

        // светящаяся линия поверх тёмной полосы
        ctx.strokeStyle = 'rgba(0,243,255,0.35)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(0, gy - 1);
        ctx.lineTo(W, gy - 1);
        ctx.stroke();
    }

    function drawCannon() {
        const gy = groundY();
        const rad = angle * Math.PI / 180;

        ctx.fillStyle = '#0e1420';
        ctx.strokeStyle = '#1f293d';
        ctx.lineWidth = 2;
        roundRectPath(START_X - 30, gy - 8, 60, 16, 6);
        ctx.fill();
        ctx.stroke();

        ctx.save();
        ctx.translate(START_X, gy);
        ctx.rotate(-rad);

        const bg = ctx.createLinearGradient(0, -9, 0, 9);
        bg.addColorStop(0, '#33456a');
        bg.addColorStop(0.5, '#182238');
        bg.addColorStop(1, '#0b111c');
        ctx.fillStyle = bg;
        ctx.strokeStyle = '#2f4666';
        ctx.lineWidth = 1.5;
        roundRectPath(-6, -9, 56, 18, 4);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = '#00f3ff';
        ctx.shadowColor = '#00f3ff';
        ctx.shadowBlur = 12;
        ctx.fillRect(44, -5, 6, 10);
        ctx.restore();

        ctx.beginPath();
        ctx.arc(START_X, gy, 7, 0, Math.PI * 2);
        ctx.fillStyle = '#0b111c';
        ctx.fill();
        ctx.strokeStyle = '#2f4666';
        ctx.lineWidth = 2;
        ctx.stroke();
    }

    function drawTrail() {
        if (trail.length < 2) return;
        const gy = groundY();
        ctx.lineCap = 'round';
        for (let i = 1; i < trail.length; i++) {
            const a = trail[i - 1], b = trail[i];
            const alpha = Math.max(0, b.life) * 0.75;
            ctx.strokeStyle = 'rgba(0,243,255,' + alpha.toFixed(3) + ')';
            ctx.lineWidth = 1.5 + alpha * 2.5;
            ctx.beginPath();
            ctx.moveTo(START_X + a.x * scale, gy - a.y * scale);
            ctx.lineTo(START_X + b.x * scale, gy - b.y * scale);
            ctx.stroke();
        }
        ctx.lineCap = 'butt';
    }

    function drawParticles() {
        if (!particles.length && flash <= 0) return;
        ctx.globalCompositeOperation = 'lighter';

        for (const p of particles) {
            const a = Math.max(0, p.life / p.maxLife);
            ctx.fillStyle = 'rgba(' + p.color + ',' + (a * 0.9).toFixed(3) + ')';
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size * (0.4 + a), 0, Math.PI * 2);
            ctx.fill();
        }

        if (flash > 0 && impact) {
            const r = (1 - flash) * 90 + 10;
            ctx.strokeStyle = 'rgba(255,200,100,' + (flash * 0.8).toFixed(3) + ')';
            ctx.lineWidth = 3 * flash + 1;
            ctx.beginPath();
            ctx.arc(impact.x, impact.y, r, 0, Math.PI * 2);
            ctx.stroke();
        }

        ctx.globalCompositeOperation = 'source-over';
    }

    function drawProjectile() {
        const px = START_X + posX * scale;
        const py = groundY() - posY * scale;

        ctx.save();
        ctx.shadowColor = '#00f3ff';
        ctx.shadowBlur = 18;
        ctx.fillStyle = '#bffcff';
        ctx.beginPath();
        ctx.arc(px, py, 7, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        ctx.fillStyle = '#ffffff';ctx.beginPath();
        ctx.arc(px, py, 3, 0, Math.PI * 2);
        ctx.fill();
    }

    function drawScaleBar() {
        const gy = groundY();
        let meters = 10, guard = 0;
        while (meters * scale > 160 && guard++ < 60) meters /= 2;
        while (meters * scale < 50  && guard++ < 120) meters *= 2;

        const len = meters * scale;
        const x1 = W - 40, x0 = x1 - len, y = gy + 46;
        if (y > H - 12) return;

        ctx.strokeStyle = 'rgba(126,139,155,0.7)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(x0, y);     ctx.lineTo(x1, y);
        ctx.moveTo(x0, y - 6); ctx.lineTo(x0, y + 6);
        ctx.moveTo(x1, y - 6); ctx.lineTo(x1, y + 6);
        ctx.stroke();

        const label = (meters < 1 ? meters.toFixed(1) : meters.toFixed(0)) + ' м';
        ctx.fillStyle = 'rgba(126,139,155,0.9)';
        ctx.font = '12px monospace';
        ctx.textAlign = 'center';
        ctx.fillText(label, (x0 + x1) / 2, y - 10);
        ctx.textAlign = 'left';
    }

    /* ================= Композиция кадра ================= */
    function render(time) {
        ctx.fillStyle = '#060810';
        ctx.fillRect(0, 0, W, H);

        if (bgCanvas) ctx.drawImage(bgCanvas, 0, 0);

        drawStars(time);
        drawTrajectoryPreview();
        drawGround();
        drawHaze();
        drawCannon();
        drawTrail();
        drawParticles();
        drawProjectile();
        drawScaleBar();
    }

    /* ================= Главный цикл ================= */
    let last = 0;
    function frame(now) {
        if (!last) last = now;
        let dt = (now - last) / 1000;
        last = now;
        if (dt > 0.05) dt = 0.05;

        update(dt);
        render(now);
        requestAnimationFrame(frame);
    }

    /* ================= События ================= */
    fireBtn.addEventListener('click', launch);
    angleSlider.addEventListener('input', updateParams);
    speedSlider.addEventListener('input', updateParams);
    gSlider.addEventListener('input', updateParams);

    window.addEventListener('resize', function () {
        resize();
        scale = computeScale(trajectory());
        if (!flying) updateParams();
        render(performance.now());
    });

    /* ================= Старт ================= */
    resize();
    updateParams();
    requestAnimationFrame(frame);
})();
</script>
</body>
</html>
