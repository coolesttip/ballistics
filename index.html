<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#060810">
<title>Баллистическая лаборатория</title>
<style>
:root{--bg:#060810;--cy:#00f3ff;--tx:#d8f6ff;--mut:#7f97a8;--pn:rgba(10,16,32,.82)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden;touch-action:manipulation}
canvas{position:fixed;inset:0;display:block}
#panel{position:fixed;top:12px;right:12px;width:290px;max-height:calc(100% - 24px);overflow-y:auto;background:var(--pn);border:1px solid rgba(0,243,255,.3);border-radius:10px;padding:12px;backdrop-filter:blur(6px)}
h1{font-size:15px;margin:0 0 8px;color:var(--cy)}
.row{margin:7px 0}
.row label{display:flex;justify-content:space-between;font-size:13px;color:var(--mut)}
.row b{color:var(--tx);font-weight:600}
input[type=range]{width:100%;accent-color:var(--cy);margin:4px 0 0}
#fireBtn{width:100%;margin-top:8px;padding:12px;font-size:15px;font-weight:600;color:#001419;background:var(--cy);border:0;border-radius:8px}
#fireBtn:disabled{opacity:.55}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px;font-size:11px;color:var(--mut);text-align:center}
.stats div{background:rgba(0,243,255,.07);border-radius:6px;padding:6px 2px}
.stats span{display:block;font:600 13px monospace;color:var(--tx);margin-top:2px}
.live{margin-top:10px;padding:8px;border:1px dashed rgba(0,243,255,.35);border-radius:6px;font:12px/1.6 monospace}
.live .f{color:var(--mut)}
.live .v{color:var(--cy)}
.layouts{display:flex;gap:6px;margin-top:10px}
.layouts button{flex:1;padding:7px 0;font-size:12px;color:var(--mut);background:transparent;border:1px solid rgba(0,243,255,.25);border-radius:6px}
.layouts button.active{color:#001419;background:var(--cy);border-color:var(--cy)}
/* мобильная раскладка: панель снизу, земля над ней */
body.layout-mobile #panel{top:auto;right:0;left:0;bottom:0;width:100%;max-height:56%;border-radius:14px 14px 0 0;border-width:1px 0 0;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px))}
body.layout-mobile .row{margin:4px 0}
body.layout-mobile .live,body.layout-mobile .stats{margin-top:6px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="panel">
  <h1>Баллистическая лаборатория</h1>
  <div class="row"><label>Угол <b id="angleVal">45°</b></label><input id="angle" type="range" min="5" max="85" step="1" value="45"></div>
  <div class="row"><label>Скорость <b id="speedVal">50 м/с</b></label><input id="speed" type="range" min="10" max="150" step="1" value="50"></div>
  <div class="row"><label>Гравитация <b id="gVal">9.8 м/с²</b></label><input id="g" type="range" min="1" max="25" step="0.1" value="9.8"></div>
  <button id="fireBtn">Запустить снаряд</button>
  <div class="stats">
    <div>Дальность<span id="statRange">0.00 м</span></div>
    <div>Высота<span id="statHeight">0.00 м</span></div>
    <div>Время<span id="statTime">0.00 с</span></div>
  </div>
  <div class="live">
    <div class="f" id="formulaX">x(t) = …</div>
    <div class="f" id="formulaY">y(t) = …</div>
    <div>t = <span class="v" id="liveT">0.00</span> с</div>
    <div>x = <span class="v" id="liveX">0.00</span> м, y = <span class="v" id="liveY">0.00</span> м</div>
  </div>
  <div class="layouts">
    <button data-layout="auto">Авто</button>
    <button data-layout="desktop">ПК</button>
    <button data-layout="mobile">Телефон</button>
  </div>
</div>
<script>
(function () {
'use strict';
/* ===== 1. Элементы и состояние ===== */
var $ = function (id) { return document.getElementById(id); };
var canvas = $('c'), ctx = canvas.getContext('2d');
var angleSlider = $('angle'), speedSlider = $('speed'), gSlider = $('g');
var angleValEl = $('angleVal'), speedValEl = $('speedVal'), gValEl = $('gVal');
var fireBtn = $('fireBtn');
var statRangeEl = $('statRange'), statHeightEl = $('statHeight'), statTimeEl = $('statTime');
var liveTEl = $('liveT'), liveXEl = $('liveX'), liveYEl = $('liveY');
var formulaXEl = $('formulaX'), formulaYEl = $('formulaY');
var layoutBtns = document.querySelectorAll('.layouts button');

var W = 0, H = 0, START_X = 70, GROUND_OFFSET = 110;
var angle = 45, speed = 50, gravity = 9.8, scale = 2;
var flying = false, posX = 0, posY = 0, timeInFlight = 0;
var trail = [], particles = [], impact = null, flash = 0;
var stars = [], bgCanvas = null, lastFrameTime = 0, resizeTimer = null;
var layoutSetting = 'auto', activeLayout = 'desktop';

/* ===== 2. Раскладка ===== */
function groundY() { return H - GROUND_OFFSET; }
function getStoredLayout() {
    try {
        var v = localStorage.getItem('ballistics-layout');
        if (v === 'auto' || v === 'desktop' || v === 'mobile') return v;
    } catch (e) {}
    return 'auto';
}
function storeLayout(v) { try { localStorage.setItem('ballistics-layout', v); } catch (e) {} }
function resolveLayout() {
    if (layoutSetting === 'auto') return (W < 700 || H > W * 1.1) ? 'mobile' : 'desktop';
    return layoutSetting;
}
function isMobileLayout() { return activeLayout === 'mobile'; }

function applyLayout() {
    activeLayout = resolveLayout();
    document.body.classList.toggle('layout-mobile', activeLayout === 'mobile');
    GROUND_OFFSET = (activeLayout === 'mobile') ? Math.round(H * 0.58) : 110;
    for (var i = 0; i < layoutBtns.length; i++) {
        var b = layoutBtns[i];
        b.classList.toggle('active', b.getAttribute('data-layout') === layoutSetting);
    }
}

/* ===== 4. Масштаб ===== */
function computeScale() {
    var rad = angle * Math.PI / 180;
    var v0x = speed * Math.cos(rad), v0y = speed * Math.sin(rad);
    var tF = 2 * v0y / gravity;
    var maxX = v0x * tF, maxY = v0y * v0y / (2 * gravity);
    var gy = groundY();
    if (maxX <= 0 || maxY <= 0) return 2;
    var rightPad = isMobileLayout() ? 40 : 330;
    var s = Math.min((W - START_X - rightPad) / maxX, (gy - 80) / maxY);
    return Math.max(0.2, Math.min(s, 10));
}

/* ===== 5. Фон ===== */
function buildBackground() {
    if (!bgCanvas) bgCanvas = document.createElement('canvas');
    var dpr = window.devicePixelRatio || 1;
    bgCanvas.width = Math.floor(W * dpr);
    bgCanvas.height = Math.floor(H * dpr);
    var b = bgCanvas.getContext('2d');
    b.setTransform(dpr, 0, 0, dpr, 0, 0);
    var grad = b.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, '#060810');
    grad.addColorStop(0.6, '#080b16');
    grad.addColorStop(1, '#0a1020');
    b.fillStyle = grad;
    b.fillRect(0, 0, W, H);
    var count = Math.max(80, Math.floor(W * H / 9000));
    for (var i = 0; i < count; i++) {
        b.globalAlpha = Math.random() * 0.55 + 0.15;
        b.fillStyle = '#fff';
        b.beginPath();
        b.arc(Math.random() * W, Math.random() * H, Math.random() * 1.3 + 0.2, 0, Math.PI * 2);
        b.fill();
    }
    b.globalAlpha = 1;
    var neb = b.createRadialGradient(W * 0.75, H * 0.25, 0, W * 0.75, H * 0.25, Math.max(W, H) * 0.5);
    neb.addColorStop(0, 'rgba(0,80,180,0.12)');
    neb.addColorStop(1, 'rgba(0,0,0,0)');
    b.fillStyle = neb;
    b.fillRect(0, 0, W, H);
}

/* ===== 6. Отрисовка ===== */
function roundRect(c, x, y, w, h, r) {
    c.beginPath();
    c.moveTo(x + r, y);
    c.lineTo(x + w - r, y);
    c.quadraticCurveTo(x + w, y, x + w, y + r);
    c.lineTo(x + w, y + h - r);
    c.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    c.lineTo(x + r, y + h);
    c.quadraticCurveTo(x, y + h, x, y + h - r);
    c.lineTo(x, y + r);
    c.quadraticCurveTo(x, y, x + r, y);
    c.closePath();
}

function drawGround() {
    var gy = groundY();
    var g = ctx.createLinearGradient(0, gy, 0, H);
    g.addColorStop(0, 'rgba(0,243,255,0.10)');
    g.addColorStop(1, 'rgba(0,102,255,0.01)');
    ctx.fillStyle = g;
    ctx.fillRect(0, gy, W, H - gy);
    ctx.strokeStyle = 'rgba(0,243,255,0.06)';
    ctx.lineWidth = 1;
    for (var x = 0; x < W; x += 50) {
        ctx.beginPath(); ctx.moveTo(x, gy); ctx.lineTo(x, H); ctx.stroke();
    }
    ctx.shadowBlur = 12;
    ctx.shadowColor = '#00f3ff';
    ctx.strokeStyle = '#00f3ff';
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(W, gy); ctx.stroke();
    ctx.shadowBlur = 0;
}

function drawDistanceMarkers() {
    var gy = groundY(), s = scale;
    if (!s || s <= 0) return;
    var stepM = 10, stepPx = stepM * s;
    while (stepPx < 55) { stepM *= 2; stepPx = stepM * s; }
    ctx.font = '10px monospace';
    ctx.fillStyle = 'rgba(0,243,255,0.4)';
    ctx.textAlign = 'center';
    for (var m = stepM; ; m += stepM) {
        var px = START_X + m * s;
        if (px > W - 10) break;
        ctx.strokeStyle = 'rgba(0,243,255,0.25)';
        ctx.beginPath(); ctx.moveTo(px, gy); ctx.lineTo(px, gy + 6); ctx.stroke();
        ctx.fillText(m + 'м', px, gy + 20);
    }
    ctx.textAlign = 'left';
}

function drawCannon() {
    var gy = groundY();
    ctx.save();
    ctx.translate(START_X, gy);
    ctx.save();
    ctx.rotate(-angle * Math.PI / 180);
    var bg = ctx.createLinearGradient(0, -7, 0, 7);
    bg.addColorStop(0, '#3a4d6e'); bg.addColorStop(0.5, '#1e2a3f'); bg.addColorStop(1, '#0e1520');
    ctx.fillStyle = bg;
    ctx.strokeStyle = '#00f3ff';
    ctx.lineWidth = 1.5;
    ctx.shadowBlur = 10;
    ctx.shadowColor = 'rgba(0,243,255,0.6)';
    roundRect(ctx, 0, -7, 48, 14, 3);
    ctx.fill(); ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.restore();
    ctx.beginPath();
    ctx.arc(0, 0, 15, Math.PI, 0);
    ctx.closePath();
    var base = ctx.createLinearGradient(0, -15, 0, 0);
    base.addColorStop(0, '#2a3550'); base.addColorStop(1, '#0e1520');
    ctx.fillStyle = base; ctx.fill();
    ctx.strokeStyle = '#00f3ff'; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.restore();
}

function drawTrajectoryPreview() {
    if (flying || impact) return;
    var rad = angle * Math.PI / 180;
    var v0x = speed * Math.cos(rad), v0y = speed * Math.sin(rad);
    var tF = 2 * v0y / gravity, s = computeScale(), gy = groundY();
    ctx.strokeStyle = 'rgba(0,243,255,0.28)';
    ctx.lineWidth = 1.5;
    ctx.setLineDash([5, 5]);
    ctx.beginPath();
    for (var i = 0; i <= 64; i++) {
        var t = (i / 64) * tF;
        var px = START_X + v0x * t * s;
        var py = gy - (v0y * t - 0.5 * gravity * t * t) * s;
        if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.stroke();
    ctx.setLineDash([]);
    var lx = START_X + v0x * tF * s;
    ctx.strokeStyle = 'rgba(0,243,255,0.6)';
    ctx.beginPath();
    ctx.moveTo(lx - 6, gy - 6); ctx.lineTo(lx + 6, gy + 6);
    ctx.moveTo(lx + 6, gy - 6); ctx.lineTo(lx - 6, gy + 6);
    ctx.stroke();
}

function drawTrail() {
    if (trail.length < 2) return;
    var gy = groundY();
    var rad = fireAngle * Math.PI / 180;
    var v0x = fireSpeed * Math.cos(rad), v0y = fireSpeed * Math.sin(rad);
    var steps = 160;
    ctx.strokeStyle = 'rgba(0,243,255,0.9)';
    ctx.lineWidth = 2;
    ctx.shadowBlur = 8;
    ctx.shadowColor = '#00f3ff';
    ctx.beginPath();
    for (var i = 0; i <= steps; i++) {
        var t = timeInFlight * i / steps;
        var px = START_X + v0x * t * scale;
        var py = gy - Math.max(0, v0y * t - 0.5 * fireGravity * t * t) * scale;
        if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.stroke();
    ctx.shadowBlur = 0;
}

function drawProjectile() {
    if (!flying) return;
    var px = START_X + posX * scale, py = groundY() - posY * scale;
    ctx.shadowBlur = 25;
    ctx.shadowColor = '#00f3ff';
    ctx.fillStyle = '#e8ffff';
    ctx.beginPath(); ctx.arc(px, py, 5, 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(0,243,255,0.3)';
    ctx.beginPath(); ctx.arc(px, py, 13, 0, Math.PI * 2); ctx.fill();
    // живая подпись координат у ядра
    ctx.font = '11px monospace';
    ctx.fillStyle = '#d8f6ff';
    ctx.fillText('(' + posX.toFixed(1) + '; ' + Math.max(0, posY).toFixed(1) + ')', px + 12, py - 12);
}

/* ===== 7. Частицы и удар ===== */
function updateParticles(dt) {
    for (var i = particles.length - 1; i >= 0; i--) {
        var p = particles[i];
        p.x += p.vx * dt; p.y += p.vy * dt; p.vy += p.g * dt; p.life -= dt;
        if (p.life <= 0) particles.splice(i, 1);
    }
}
function drawParticles() {
    for (var i = 0; i < particles.length; i++) {
        var p = particles[i];
        var a = Math.max(0, Math.min(1, p.life / p.maxLife));
        ctx.globalAlpha = a;
        ctx.fillStyle = p.color;
        ctx.shadowBlur = 6;
        ctx.shadowColor = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * (0.4 + a * 0.6), 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.shadowBlur = 0;
}
function spawnImpact(px, py) {
    impact = { x: px, y: py, t: 0 };
    flash = 1;
    for (var i = 0; i < 50; i++) {
        var ang = Math.random() * Math.PI * 2, spd = 80 + Math.random() * 260, life = 0.6 + Math.random() * 0.9;
        particles.push({
            x: px, y: py, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd - 120, g: 450,
            life: life, maxLife: life, size: 1.5 + Math.random() * 2.5,
            color: Math.random() > 0.4 ? '#00f3ff' : '#ffaa00'
        });
    }
}
function drawImpact() {
    if (!impact) return;
    var a = Math.max(0, 1 - impact.t / 1.8);
    ctx.strokeStyle = 'rgba(0,243,255,' + (a * 0.7) + ')';
    ctx.lineWidth = 2.5 * a + 0.5;
    ctx.beginPath(); ctx.arc(impact.x, impact.y, impact.t * 180, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = 'rgba(0,243,255,' + (a * 0.25) + ')';
    ctx.beginPath(); ctx.arc(impact.x, impact.y, 25 * (1 + impact.t * 0.5), 0, Math.PI * 2); ctx.fill();
}

/* ===== 8. Физика ===== */
var fireAngle = 45, fireSpeed = 50, fireGravity = 9.8, maxHeightReached = 0;

function updatePhysics(dt) {
    if (!flying) return;
    timeInFlight += dt;
    var rad = fireAngle * Math.PI / 180;
    var v0x = fireSpeed * Math.cos(rad), v0y = fireSpeed * Math.sin(rad);
    posX = v0x * timeInFlight;
    posY = v0y * timeInFlight - 0.5 * fireGravity * timeInFlight * timeInFlight;
    if (posY > maxHeightReached) maxHeightReached = posY;

    if (posY < 0 && timeInFlight > 0.02) {
        var tLand = 2 * v0y / fireGravity;
        timeInFlight = tLand; posX = v0x * tLand; posY = 0;
        trail.push({ x: posX, y: posY });
        spawnImpact(START_X + posX * scale, groundY());
        flying = false;
        fireBtn.disabled = false;
        fireBtn.textContent = 'Запустить снаряд';
        updateStats();
        return;
    }
    trail.push({ x: posX, y: posY });
    if (trail.length > 5000) trail.shift();
    if (Math.random() > 0.5) {
        particles.push({
            x: START_X + posX * scale, y: groundY() - posY * scale,
            vx: (Math.random() - 0.5) * 20, vy: (Math.random() - 0.5) * 20, g: 0,
            life: 0.4 + Math.random() * 0.3, maxLife: 0.7, size: 1 + Math.random() * 1.5, color: '#00f3ff'
        });
    }
    updateStats();
}

/* ===== 9. Статистика и формулы ===== */
function updateStats() {
    statRangeEl.textContent = posX.toFixed(2) + ' м';
    statHeightEl.textContent = (flying ? Math.max(0, posY) : maxHeightReached).toFixed(2) + ' м';
    statTimeEl.textContent = timeInFlight.toFixed(2) + ' с';
    liveTEl.textContent = timeInFlight.toFixed(2);
    liveXEl.textContent = posX.toFixed(2);
    liveYEl.textContent = Math.max(0, posY).toFixed(2);
}
function updatePreviewStats() {
    if (flying) return;
    var rad = angle * Math.PI / 180;
    var v0x = speed * Math.cos(rad), v0y = speed * Math.sin(rad);
    var tF = 2 * v0y / gravity;
    statRangeEl.textContent = (v0x * tF).toFixed(2) + ' м';
    statHeightEl.textContent = (v0y * v0y / (2 * gravity)).toFixed(2) + ' м';
    statTimeEl.textContent = tF.toFixed(2) + ' с';
    liveTEl.textContent = '0.00'; liveXEl.textContent = '0.00'; liveYEl.textContent = '0.00';
}
function updateFormula() {
    var rad = angle * Math.PI / 180;
    formulaXEl.textContent = 'x(t) = ' + (speed * Math.cos(rad)).toFixed(1) + ' · t';
    formulaYEl.textContent = 'y(t) = ' + (speed * Math.sin(rad)).toFixed(1) + ' · t − ' + (gravity / 2).toFixed(2) + ' · t²';
}

/* ===== 10. Запуск ===== */
function fire() {
    if (flying) return;
    posX = 0; posY = 0; timeInFlight = 0; maxHeightReached = 0;
    trail = []; particles = []; impact = null; flash = 0;
    fireAngle = angle; fireSpeed = speed; fireGravity = gravity;
    scale = computeScale();
    flying = true;
    fireBtn.disabled = true;
    fireBtn.textContent = 'Полёт...';
    var gy = groundY();
    for (var i = 0; i < 12; i++) {
        particles.push({
            x: START_X, y: gy, vx: (Math.random() - 0.5) * 120, vy: -Math.random() * 80, g: 300,
            life: 0.4 + Math.random() * 0.3, maxLife: 0.7, size: 1 + Math.random() * 2, color: '#00f3ff'
        });
    }
}

/* ===== 11. Главный цикл ===== */
function frame(now) {
    requestAnimationFrame(frame);
    if (!lastFrameTime) lastFrameTime = now;
    var dt = Math.min((now - lastFrameTime) / 1000, 0.05);
    lastFrameTime = now;

    updatePhysics(dt);
    updateParticles(dt);
    if (impact) { impact.t += dt; if (impact.t > 1.8) impact = null; }
    if (flash > 0) flash = Math.max(0, flash - dt * 2.5);

    ctx.clearRect(0, 0, W, H);
    if (bgCanvas) ctx.drawImage(bgCanvas, 0, 0, W, H);
    drawGround();
    drawDistanceMarkers();
    drawTrajectoryPreview();
    drawTrail();
    drawCannon();
    drawProjectile();
    drawParticles();
    drawImpact();
    if (flash > 0) {
        ctx.fillStyle = 'rgba(0,243,255,' + (flash * 0.12) + ')';
        ctx.fillRect(0, 0, W, H);
    }
}

/* ===== 12. Resize ===== */
function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    var dpr = window.devicePixelRatio || 1;
    canvas.width = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    applyLayout();
    buildBackground();
    if (!flying) scale = computeScale();
}

/* ===== 13. Инициализация (обработчики — первыми) ===== */
function init() {
    function onParam() {
        updateFormula();
        if (!flying) { trail = []; impact = null; scale = computeScale(); updatePreviewStats(); }
    }
    angleSlider.addEventListener('input', function () {
        angle = parseFloat(this.value); angleValEl.textContent = angle + '°'; onParam();
    });
    speedSlider.addEventListener('input', function () {
        speed = parseFloat(this.value); speedValEl.textContent = speed + ' м/с'; onParam();
    });
    gSlider.addEventListener('input', function () {
        gravity = parseFloat(this.value); gValEl.textContent = gravity.toFixed(1) + ' м/с²'; onParam();
    });
    fireBtn.addEventListener('click', fire);

    for (var i = 0; i < layoutBtns.length; i++) {
        (function (btn) {
            btn.addEventListener('click', function () {
                layoutSetting = btn.getAttribute('data-layout');
                storeLayout(layoutSetting);
                applyLayout();
                if (!flying) { scale = computeScale(); }
            });
        })(layoutBtns[i]);
    }

    window.addEventListener('resize', function () {
        clearTimeout(resizeTimer); resizeTimer = setTimeout(resize, 100);
    });
    window.addEventListener('orientationchange', function () {
        clearTimeout(resizeTimer); resizeTimer = setTimeout(resize, 150);
    });
    document.addEventListener('visibilitychange', function () {
        if (document.hidden) lastFrameTime = 0;
    });

    layoutSetting = getStoredLayout();
    resize();
    updateFormula();
    updatePreviewStats();
    requestAnimationFrame(frame);
}

init();
})();
</script>
</body>
</html>
